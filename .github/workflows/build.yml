name: Test and build apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
  desktop:
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Test real system clipboard
        run: pnpm exec electron tests/electron-clipboard-smoke.cjs
      - if: runner.os == 'macOS'
        run: pnpm exec electron-builder --mac dmg zip --arm64 --x64 --publish never
      - if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Test packaged Windows clipboard modules
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GARDEN_APP_ROOT = Join-Path $PWD 'release/win-unpacked/resources/app.asar'
          pnpm exec electron tests/electron-clipboard-smoke.cjs
      - name: Test packaged macOS clipboard modules
        if: runner.os == 'macOS'
        run: |
          ARCH=$(node -p process.arch)
          if [ "$ARCH" = arm64 ]; then APP_DIR=mac-arm64; else APP_DIR=mac; fi
          GARDEN_APP_ROOT="$PWD/release/$APP_DIR/剪贴花园 Next.app/Contents/Resources/app.asar" pnpm exec electron tests/electron-clipboard-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ClipGarden-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Build and lint Android
        working-directory: android
        run: bash ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ClipGarden-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
