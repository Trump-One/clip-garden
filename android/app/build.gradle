plugins {
    id 'com.android.application' version '9.0.0'
}

android {
    namespace 'com.trumpone.clipgarden'
    compileSdk 36

    defaultConfig {
        applicationId 'com.trumpone.clipgarden'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
